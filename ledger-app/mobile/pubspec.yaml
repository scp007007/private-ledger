name: ledger_mobile
description: Self-hosted, offline-capable personal ledger client.
publish_to: none
version: 0.4.2+10

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
